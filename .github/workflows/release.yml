name: Build & Release (Windows EXE + Android APK)

on:
  workflow_dispatch:
    inputs:
      app_version:
        description: 'App version (e.g. 1.2.0) — leave empty to use package.json / نسخهی برنامه'
        required: false
        default: ''
        type: string
      version_code:
        description: 'Android versionCode / build number (integer) — leave empty to derive from the version / شمارهی نسخهی اندروید'
        required: false
        default: ''
        type: string
      build_target:
        description: 'What to build / چه چیزی ساخته شود'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - windows
          - android
      release_notes:
        description: 'Optional release notes (Markdown) / توضیحات انتشار (اختیاری)'
        required: false
        default: ''
        type: string
      draft:
        description: 'Create as a draft release / ساخت به عنوان پیشنویس'
        required: false
        default: 'false'
        type: boolean
      prerelease:
        description: 'Mark as prerelease / علامتگذاری به عنوان پیشانتشار'
        required: false
        default: 'false'
        type: boolean
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  pull-requests: write

jobs:
  test:
    name: Tests (store / main / renderer + UI smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # --ignore-scripts: the test job never launches Electron, so downloading
      # the ~100 MB binary (and running electron-builder's postinstall) is
      # pointless and only adds a way for CI to fail.
      - run: npm ci --ignore-scripts
      - run: npm test

  configure:
    name: Resolve version & release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      version_code: ${{ steps.resolve.outputs.version_code }}
      target: ${{ steps.resolve.outputs.target }}
      release_notes: ${{ steps.resolve.outputs.release_notes }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      release_name: ${{ steps.resolve.outputs.release_name }}
      release_files: ${{ steps.resolve.outputs.release_files }}
      draft: ${{ steps.resolve.outputs.draft }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version and release metadata
        id: resolve
        env:
          INPUT_APP_VERSION: ${{ github.event.inputs.app_version }}
          INPUT_VERSION_CODE: ${{ github.event.inputs.version_code }}
          INPUT_TARGET: ${{ github.event.inputs.build_target }}
          INPUT_RELEASE_NOTES: ${{ github.event.inputs.release_notes }}
          INPUT_DRAFT: ${{ github.event.inputs.draft }}
          INPUT_PRERELEASE: ${{ github.event.inputs.prerelease }}
        run: |
          set -euo pipefail

          PKG_VERSION="$(node -p "require('./package.json').version")"
          REF="${GITHUB_REF:-}"
          EVENT="${GITHUB_EVENT_NAME:-}"

          if [[ "${EVENT}" == "workflow_dispatch" ]]; then
            VERSION="${INPUT_APP_VERSION:-${PKG_VERSION}}"
            VERSION_CODE="${INPUT_VERSION_CODE:-}"
            TARGET="${INPUT_TARGET:-both}"
            RELEASE_NOTES="${INPUT_RELEASE_NOTES:-}"
            DRAFT="${INPUT_DRAFT:-false}"
            PRERELEASE="${INPUT_PRERELEASE:-false}"
          elif [[ "${REF}" == refs/tags/* ]]; then
            VERSION="${REF#refs/tags/}"
            VERSION="${VERSION#v}"
            VERSION_CODE="$(node -e "const p='${VERSION}'.split('.').map(Number); console.log((p[0]||0)*100000 + (p[1]||0)*1000 + (p[2]||0))")"
            TARGET="both"
            RELEASE_NOTES=""
            DRAFT="false"
            PRERELEASE="false"
          else
            VERSION="${PKG_VERSION}"
            VERSION_CODE="$(node -e "const p='${VERSION}'.split('.').map(Number); console.log((p[0]||0)*100000 + (p[1]||0)*1000 + (p[2]||0))")"
            TARGET="both"
            RELEASE_NOTES=""
            DRAFT="false"
            PRERELEASE="false"
          fi

          VERSION="${VERSION#v}"
          VERSION="${VERSION// /}"
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid app_version '${VERSION}'. Expected a semver like 1.2.0."
            exit 1
          fi
          if [[ -z "${VERSION_CODE}" ]]; then
            VERSION_CODE="$(node -e "const p='${VERSION}'.split('.').map(Number); console.log((p[0]||0)*100000 + (p[1]||0)*1000 + (p[2]||0))")"
            echo "Derived Android versionCode ${VERSION_CODE} from version ${VERSION}."
          fi
          if [[ ! "${VERSION_CODE}" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid version_code '${VERSION_CODE}'. Expected a positive integer."
            exit 1
          fi
          if [[ "${TARGET}" != "both" && "${TARGET}" != "windows" && "${TARGET}" != "android" ]]; then
            echo "::error::Invalid build_target '${TARGET}'. Expected both, windows or android."
            exit 1
          fi

          if [[ "${REF}" == refs/tags/* ]]; then
            RELEASE_TAG="${REF#refs/tags/}"
          else
            RELEASE_TAG="v${VERSION}"
          fi

          case "${TARGET}" in
            windows)
              RELEASE_NAME="NovaClip v${VERSION} — Windows"
              RELEASE_FILES="nova-exe/*.exe"
              ;;
            android)
              RELEASE_NAME="NovaClip v${VERSION} — Android"
              RELEASE_FILES="nova-apk/*.apk"
              ;;
            *)
              RELEASE_NAME="NovaClip v${VERSION} — Windows & Android"
              RELEASE_FILES=$'nova-exe/*.exe\nnova-apk/*.apk'
              ;;
          esac

          echo "Resolved version: ${VERSION}"
          echo "Resolved versionCode: ${VERSION_CODE}"
          echo "Resolved target: ${TARGET}"
          echo "Resolved release tag: ${RELEASE_TAG}"
          echo "Resolved release name: ${RELEASE_NAME}"

          {
            echo "version=${VERSION}"
            echo "version_code=${VERSION_CODE}"
            echo "target=${TARGET}"
            echo "release_tag=${RELEASE_TAG}"
            echo "release_name=${RELEASE_NAME}"
            echo "draft=${DRAFT}"
            echo "prerelease=${PRERELEASE}"
            echo "release_notes<<EOF"
            printf '%s' "${RELEASE_NOTES}"
            printf '\n'
            echo "EOF"
            echo "release_files<<EOF"
            printf '%s' "${RELEASE_FILES}"
            printf '\n'
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  build-windows:
    name: Windows installer (7 → 11)
    runs-on: windows-latest
    needs: [test, configure]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply requested version
        run: node scripts/set-version.js "${{ needs.configure.outputs.version }}" "${{ needs.configure.outputs.version_code }}"
      - name: Build Windows installer
        if: needs.configure.outputs.target != 'android'
        shell: pwsh
        run: |
          $log = npm run build:win 2>&1
          $code = $LASTEXITCODE
          $log | Set-Content -Path build-log.txt -Encoding utf8
          Write-Output $log
          if ($code -ne 0) { exit $code }
      - name: Report failure
        if: failure() && needs.configure.outputs.target != 'android'
        shell: bash
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node -e '
            const https = require("https");
            const fs = require("fs");
            const log = fs.existsSync("build-log.txt") ? fs.readFileSync("build-log.txt", "utf8").replace(/\r/g, "").slice(-8000) : "(no build log available)";
            const body = "### ❌ Windows build failed\n```\n" + log + "\n```";
            const payload = JSON.stringify({ body });
            const req = https.request({
              hostname: "api.github.com",
              path: "/repos/AnishtayiN/ClipBoard/issues/1/comments",
              method: "POST",
              headers: {
                Authorization: "Bearer " + process.env.TOKEN,
                "User-Agent": "novaclip-ci",
                Accept: "application/vnd.github+json",
                "Content-Type": "application/json",
                "Content-Length": Buffer.byteLength(payload)
              }
            }, res => { let d = ""; res.on("data", c => d += c); res.on("end", () => console.log("comment:", res.statusCode, d.slice(0, 200))); });
            req.on("error", e => console.error(e));
            req.write(payload); req.end();
          '
      - uses: actions/upload-artifact@v4
        if: success() && needs.configure.outputs.target != 'android'
        with:
          name: nova-exe
          path: |
            dist/*.exe
            dist/*.yml
          if-no-files-found: error

  build-android:
    name: Android APK (7 → latest)
    runs-on: ubuntu-latest
    needs: [test, configure]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMGR=$(ls "$SDK"/cmdline-tools/latest/bin/sdkmanager 2>/dev/null || ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "Using sdkmanager: $SDKMGR"
          if [ -n "$SDKMGR" ]; then
            yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
            "$SDKMGR" "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null 2>&1 || true
          fi
      - run: npm ci
      - name: Apply requested version
        run: node scripts/set-version.js "${{ needs.configure.outputs.version }}" "${{ needs.configure.outputs.version_code }}"
      - name: Build Android APK
        if: needs.configure.outputs.target != 'windows'
        run: |
          set -o pipefail
          npm run build:android 2>&1 | tee build-log.txt
      - name: Report failure
        if: failure() && needs.configure.outputs.target != 'windows'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node -e '
            const https = require("https");
            const fs = require("fs");
            const log = fs.existsSync("build-log.txt") ? fs.readFileSync("build-log.txt", "utf8").replace(/\r/g, "").slice(-8000) : "(no build log available)";
            const body = "### ❌ Android build failed\n```\n" + log + "\n```";
            const payload = JSON.stringify({ body });
            const req = https.request({
              hostname: "api.github.com",
              path: "/repos/AnishtayiN/ClipBoard/issues/1/comments",
              method: "POST",
              headers: {
                Authorization: "Bearer " + process.env.TOKEN,
                "User-Agent": "novaclip-ci",
                Accept: "application/vnd.github+json",
                "Content-Type": "application/json",
                "Content-Length": Buffer.byteLength(payload)
              }
            }, res => { let d = ""; res.on("data", c => d += c); res.on("end", () => console.log("comment:", res.statusCode, d.slice(0, 200))); });
            req.on("error", e => console.error(e));
            req.write(payload); req.end();
          '
      - name: Rename APK
        if: success() && needs.configure.outputs.target != 'windows'
        run: |
          VERSION="${{ needs.configure.outputs.version }}"
          VERSION="${VERSION#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mv android/app/build/outputs/apk/release/app-release.apk "NovaClip-v${VERSION}-android.apk"
      - uses: actions/upload-artifact@v4
        if: success() && needs.configure.outputs.target != 'windows'
        with:
          name: nova-apk
          path: NovaClip-v*.apk
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    # ⚠️ 'configure' MUST be listed here. `needs.<job>.outputs` is only populated for
    # jobs declared in `needs`; without it every needs.configure.outputs.* below
    # expands to an empty string → softprops fails with
    # "⚠️ GitHub Releases requires a tag" and the assets/notes end up blank.
    needs: [configure, build-windows, build-android]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
      - name: Show artifacts
        run: ls -R .
      - name: Validate release metadata
        shell: bash
        env:
          VERSION: ${{ needs.configure.outputs.version }}
          RELEASE_TAG: ${{ needs.configure.outputs.release_tag }}
          RELEASE_NAME: ${{ needs.configure.outputs.release_name }}
          RELEASE_FILES: ${{ needs.configure.outputs.release_files }}
        run: |
          set -euo pipefail
          err=0

          for pair in "version=${VERSION}" "release_tag=${RELEASE_TAG}" "release_name=${RELEASE_NAME}" "release_files=${RELEASE_FILES}"; do
            name="${pair%%=*}"
            value="${pair#*=}"
            if [ -z "${value}" ]; then
              echo "::error::needs.configure.outputs.${name} is empty. The 'release' job must declare 'needs: [configure, ...]' so that the configure job outputs are visible."
              err=1
            fi
          done

          if [ ! -d nova-exe ] && [ ! -d nova-apk ]; then
            echo "::error::No downloaded artifact directory found (expected nova-exe and/or nova-apk). Did the build jobs upload their artifacts?"
            err=1
          fi

          while IFS= read -r pattern; do
            [ -z "${pattern}" ] && continue
            hits="$(ls ${pattern} 2>/dev/null || true)"
            if [ -n "${hits}" ]; then
              echo "✔ '${pattern}' matched:"
              echo "${hits}" | sed 's/^/    /'
            else
              echo "::error::No build artifact matches '${pattern}'. The requested build probably produced no files."
              err=1
            fi
          done <<< "${RELEASE_FILES}"

          if [ "${err}" -ne 0 ]; then
            echo "::error::Aborting before publishing: release metadata or artifacts are incomplete."
            exit 1
          fi

          echo "Release tag:  ${RELEASE_TAG}"
          echo "Release name: ${RELEASE_NAME}"
          echo "Assets:"
          ls -la ${RELEASE_FILES} 2>/dev/null || true

      - name: Ensure the release tag exists
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.configure.outputs.release_tag }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"

          # For `workflow_dispatch` runs the tag does not exist yet — create it
          # ourselves so the release always points at the exact commit we built.
          code="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${api}/git/ref/tags/${RELEASE_TAG}")"

          if [ "${code}" = "200" ]; then
            echo "Tag ${RELEASE_TAG} already exists — reusing it."
            exit 0
          fi

          body="$(printf '{"ref":"refs/tags/%s","sha":"%s"}' "${RELEASE_TAG}" "${GITHUB_SHA}")"
          resp="$(curl -sS -w '\n%{http_code}' -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -d "${body}" \
            "${api}/git/refs")"
          status="${resp##*$'\n'}"

          if [ "${status}" = "201" ]; then
            echo "Created tag ${RELEASE_TAG} at ${GITHUB_SHA}."
          elif [ "${status}" = "422" ]; then
            echo "Tag ${RELEASE_TAG} was created concurrently — reusing it."
          else
            echo "::error::Could not create tag ${RELEASE_TAG} (HTTP ${status}). Check that the workflow has 'permissions: contents: write'."
            printf '%s\n' "${resp}"
            exit 1
          fi

      - name: Publish release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.configure.outputs.release_tag }}
          name: ${{ needs.configure.outputs.release_name }}
          # Always point the release at the commit we actually built, so a tag
          # created by this run never lands on the wrong commit.
          target_commitish: ${{ github.sha }}
          body: |
            # NovaClip v${{ needs.configure.outputs.version }}

            ${{ needs.configure.outputs.release_notes }}

            A graphical, cross-platform clipboard manager.

            ## Windows (7 → 11)
            - `NovaClip-Setup-${{ needs.configure.outputs.version }}-x64.exe` — installer (64-bit)
            - `NovaClip-Setup-${{ needs.configure.outputs.version }}-ia32.exe` — installer (32-bit)

            ## Android (7.0 → latest)
            - `NovaClip-v${{ needs.configure.outputs.version }}-android.apk`

            ## Features
            - Real-time clipboard history with automatic type detection (text / link / email / color / code / image)
            - Instant search, favorites & pinning, sorting, deduplication
            - Dark & light themes, accent colors, RTL Persian + English UI
            - AI assistant (OpenAI / Anthropic / DeepSeek / Ollama / custom endpoint)
            - AES-GCM encrypted history (optional password)
            - JSON export / import
            - Global hotkey `Ctrl+Shift+V` (Windows) & system-tray support
            - Automatic update check: older builds are blocked and point to this release
            - In-app developer links (GitHub + Telegram)

            See README for full documentation.
          files: ${{ needs.configure.outputs.release_files }}
          # Booleans must be real true/false strings for the action's parser.
          draft: ${{ needs.configure.outputs.draft == 'true' }}
          prerelease: ${{ needs.configure.outputs.prerelease == 'true' }}
          generate_release_notes: false
          # A re-run with the same version replaces the binaries instead of 422-ing.
          overwrite_files: true
          # Never publish a release with missing assets — fail loudly instead.
          fail_on_unmatched_files: true
          # NovaClip's update check reads /releases/latest, so the newest
          # published build must be flagged as latest (drafts/prereleases cannot).
          make_latest: ${{ needs.configure.outputs.prerelease != 'true' && needs.configure.outputs.draft != 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release summary
        if: success()
        shell: bash
        env:
          RELEASE_URL: ${{ steps.release.outputs.url }}
          RELEASE_ID: ${{ steps.release.outputs.id }}
          TAG: ${{ needs.configure.outputs.release_tag }}
          VERSION: ${{ needs.configure.outputs.version }}
        run: |
          assets="$(find nova-exe nova-apk -maxdepth 1 -type f \( -name '*.exe' -o -name '*.apk' \) -printf '  - %f (%s bytes)\n' 2>/dev/null | sort || true)"
          [ -n "${assets}" ] || assets="  - (none)"
          {
            echo "### 🎉 NovaClip v${VERSION} published"
            echo ""
            echo "- **Tag:** \`${TAG}\`"
            echo "- **Release:** ${RELEASE_URL:-https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}}"
            echo "- **Release id:** ${RELEASE_ID:-n/a}"
            echo "- **Commit:** \`${GITHUB_SHA}\`"
            echo ""
            echo "**Assets uploaded**"
            echo ""
            echo "${assets}"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Release URL: ${RELEASE_URL:-n/a}"
