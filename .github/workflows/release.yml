name: Build & Release (Windows EXE + Android APK)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  pull-requests: write

jobs:
  test:
    name: UI smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run smoke

  build-windows:
    name: Windows installer (7 → 11)
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build Windows installer
        shell: pwsh
        run: |
          $log = npm run build:win 2>&1
          $code = $LASTEXITCODE
          $log | Set-Content -Path build-log.txt -Encoding utf8
          Write-Output $log
          if ($code -ne 0) { exit $code }
      - name: Report failure
        if: failure()
        shell: bash
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node -e '
            const https = require("https");
            const fs = require("fs");
            const log = fs.readFileSync("build-log.txt", "utf8").replace(/\r/g, "").slice(-8000);
            const body = "### ❌ Windows build failed\n```\n" + log + "\n```";
            const payload = JSON.stringify({ body });
            const req = https.request({
              hostname: "api.github.com",
              path: "/repos/AnishtayiN/ClipBoard/issues/1/comments",
              method: "POST",
              headers: {
                Authorization: "Bearer " + process.env.TOKEN,
                "User-Agent": "novaclip-ci",
                Accept: "application/vnd.github+json",
                "Content-Type": "application/json",
                "Content-Length": Buffer.byteLength(payload)
              }
            }, res => { let d = ""; res.on("data", c => d += c); res.on("end", () => console.log("comment:", res.statusCode, d.slice(0, 200))); });
            req.on("error", e => console.error(e));
            req.write(payload); req.end();
          '
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: nova-exe
          path: |
            dist/*.exe
            dist/*.yml
          if-no-files-found: error

  build-android:
    name: Android APK (7 → latest)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMGR=$(ls "$SDK"/cmdline-tools/latest/bin/sdkmanager 2>/dev/null || ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "Using sdkmanager: $SDKMGR"
          if [ -n "$SDKMGR" ]; then
            yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
            "$SDKMGR" "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null 2>&1 || true
          fi
      - run: npm ci
      - name: Build Android APK
        run: |
          set -o pipefail
          npm run build:android 2>&1 | tee build-log.txt
      - name: Report failure
        if: failure()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node -e '
            const https = require("https");
            const fs = require("fs");
            const log = fs.readFileSync("build-log.txt", "utf8").replace(/\r/g, "").slice(-8000);
            const body = "### ❌ Android build failed\n```\n" + log + "\n```";
            const payload = JSON.stringify({ body });
            const req = https.request({
              hostname: "api.github.com",
              path: "/repos/AnishtayiN/ClipBoard/issues/1/comments",
              method: "POST",
              headers: {
                Authorization: "Bearer " + process.env.TOKEN,
                "User-Agent": "novaclip-ci",
                Accept: "application/vnd.github+json",
                "Content-Type": "application/json",
                "Content-Length": Buffer.byteLength(payload)
              }
            }, res => { let d = ""; res.on("data", c => d += c); res.on("end", () => console.log("comment:", res.statusCode, d.slice(0, 200))); });
            req.on("error", e => console.error(e));
            req.write(payload); req.end();
          '
      - name: Rename APK
        if: success()
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="$(node -p "require('./package.json').version")"
          fi
          VERSION="${VERSION#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mv android/app/build/outputs/apk/release/app-release.apk "NovaClip-v${VERSION}-android.apk"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: nova-apk
          path: NovaClip-v*.apk
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-windows, build-android]
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="$(node -p "require('./package.json').version")"
          fi
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
      - name: Show artifacts
        run: ls -R .
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.version.outputs.version) }}
          name: NovaClip v${{ steps.version.outputs.version }} — Windows & Android
          body: |
            # NovaClip v${{ steps.version.outputs.version }}

            A graphical, cross-platform clipboard manager.

            ## Windows (7 → 11)
            - `NovaClip-Setup-${{ steps.version.outputs.version }}-x64.exe` — installer (64-bit)
            - `NovaClip-Setup-${{ steps.version.outputs.version }}-ia32.exe` — installer (32-bit)

            ## Android (7.0 → latest)
            - `NovaClip-v${{ steps.version.outputs.version }}-android.apk`

            ## Features
            - Real-time clipboard history with automatic type detection (text / link / email / color / code / image)
            - Instant search, favorites & pinning, sorting, deduplication
            - Dark & light themes, accent colors, RTL Persian + English UI
            - AI assistant (OpenAI / Anthropic / DeepSeek / Ollama / custom endpoint)
            - AES-GCM encrypted history (optional password)
            - JSON export / import
            - Global hotkey `Ctrl+Shift+V` (Windows) & system-tray support
            - Automatic update check: older builds are blocked and point to this release
            - In-app developer links (GitHub + Telegram)

            See README for full documentation.
          files: |
            nova-exe/*.exe
            nova-apk/*.apk
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
